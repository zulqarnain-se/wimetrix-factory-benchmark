<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WiMetrix — Factory Benchmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============================= BENCHMARK WIZARD ============================= -->
<div id="benchmark-wizard-app" role="region" aria-label="Benchmark your Factory"
     class="w-full max-w-lg mx-auto bg-white rounded-2xl border border-slate-200/80 border-t-2 border-t-emerald-500/80">
  <div class="p-6">
    <!-- FORM STATE -->
    <div id="modal-form-state">
      <div class="mb-4">
        <div class="flex items-center justify-between mb-2">
          <span id="step-badge" class="inline-flex items-center bg-emerald-50 text-emerald-700 text-[11px] font-bold px-2.5 py-1 rounded-full border border-emerald-200/50">Step 1 of 4</span>
        </div>
        <div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
          <div id="progress-fill" class="h-full bg-emerald-500 rounded-full transition-all duration-500 ease-out" style="width:25%"></div>
        </div>
      </div>

      <div id="step-panels">
        <div class="step-panel" data-step="1"></div>
        <div class="step-panel hidden" data-step="2"></div>
        <div class="step-panel hidden" data-step="3"></div>
        <div class="step-panel hidden" data-step="4"></div>
      </div>

      <div class="mt-5 flex items-center justify-between">
        <button id="wizard-back" type="button" class="hidden inline-flex items-center gap-1 text-xs font-semibold text-slate-500 hover:text-slate-800 transition-colors">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
        <button id="wizard-next" type="button" disabled
          class="ml-auto inline-flex items-center gap-1.5 rounded-lg px-4 py-2.5 text-xs font-bold transition-all duration-200 bg-slate-100 text-slate-400 cursor-not-allowed">
          Next Step
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </div>

    <!-- RESULTS STATE -->
    <div id="modal-results-state" class="hidden"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/formulas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
